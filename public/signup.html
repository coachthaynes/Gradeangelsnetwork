<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up, Grade Angels Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B0B0B" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <nav class="nav" id="site-nav"></nav>

  <main class="wrap narrow">
    <div class="card accent">
      <h1>Create your account</h1>
      <div id="msg" class="msg" style="display:none"></div>
      <form id="signup-form">
        <label for="role">I am a</label>
        <select id="role" required>
          <option value="teacher">Teacher, posting work to be graded</option>
          <option value="grade_angel">Grade Angel, grading work for pay</option>
        </select>

        <label for="full_name">Full name</label>
        <input id="full_name" required autocomplete="name" />

        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        <p class="muted">At least 8 characters.</p>

        <label for="school_or_org">School or organization (optional)</label>
        <input id="school_or_org" />

        <label for="subjects">Subjects (optional)</label>
        <input id="subjects" placeholder="Math, reading, science" />

        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:1.5rem">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </main>

  <footer><span class="brand-line">Grade Angels Network</span><br />Helping teachers get their evenings back.</footer>

  <script src="/js/api.js"></script>
  <script>
    apiGet("/api/auth/me").then(({ user }) => renderNav(user)).catch(() => renderNav(null));

    const form = document.getElementById("signup-form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showMessage(msg, "", "");
      const submitBtn = form.querySelector("button");
      submitBtn.disabled = true;
      try {
        const { user } = await apiPostJson("/api/auth/signup", {
          role: document.getElementById("role").value,
          full_name: document.getElementById("full_name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          school_or_org: document.getElementById("school_or_org").value,
          subjects: document.getElementById("subjects").value,
        });
        window.location.href = user.role === "teacher" ? "/dashboard-teacher.html" : "/dashboard-grade-angel.html";
      } catch (err) {
        showMessage(msg, err.message, "error");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
