<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher dashboard, Grade Angels Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B0B0B" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <nav class="nav" id="site-nav"></nav>

  <main class="wrap">
    <h1>Post an assignment</h1>
    <div class="card">
      <div id="create-msg" class="msg" style="display:none"></div>
      <form id="create-form">
        <label for="title">Title</label>
        <input id="title" required placeholder="Chapter 4 vocabulary quiz" />

        <div class="grid cols-2">
          <div>
            <label for="subject">Subject</label>
            <input id="subject" required placeholder="Reading" />
          </div>
          <div>
            <label for="grade_level">Grade level</label>
            <input id="grade_level" required placeholder="4th grade" />
          </div>
        </div>

        <div class="grid cols-2">
          <div>
            <label for="assignment_type">Type</label>
            <select id="assignment_type" required>
              <option value="multiple_choice">Multiple choice</option>
              <option value="combo">Combination</option>
              <option value="essay">Essay</option>
            </select>
          </div>
          <div>
            <label for="turnaround_hours">Needed back within</label>
            <select id="turnaround_hours">
              <option value="24">24 hours</option>
              <option value="48" selected>48 hours</option>
              <option value="72">3 days</option>
              <option value="96">4 days</option>
            </select>
          </div>
        </div>

        <div class="grid cols-2">
          <div>
            <label for="rate_per_page">Rate per page, in dollars</label>
            <input id="rate_per_page" type="number" min="0.01" step="0.01" required placeholder="1.00" />
          </div>
          <div>
            <label for="invite">Send to</label>
            <select id="invite">
              <option value="">Any available Grade Angel</option>
            </select>
          </div>
        </div>
        <p class="muted" id="invite-note" style="display:none"></p>

        <label for="instructions">Instructions (optional)</label>
        <textarea id="instructions" placeholder="Answer key is on the last page. Flag anything left blank."></textarea>

        <label>Pages</label>
        <div id="uploader"></div>
        <p class="privacy-tip">Privacy tip: cover or fold over student names, or have students write an ID number instead. Grade Angels only need the work.</p>

        <div class="total-row">
          <span id="total-line" class="muted">Add pages to see the total.</span>
        </div>
        <div id="upload-progress" class="progress" style="display:none"><div class="progress-bar" id="upload-bar"></div></div>

        <button class="btn" type="submit">Post assignment</button>
      </form>
    </div>

    <h2 class="section-title">Your assignments</h2>
    <div id="list"></div>
  </main>

  <footer><span class="brand-line">Grade Angels Network</span><br />Helping teachers get their evenings back.</footer>

  <script src="/js/api.js"></script>
  <script src="/js/page-uploader.js"></script>
  <script>
    const EVENT_NOTES = { declined: "declined", handed_back: "handed it back" };

    const uploader = new PageUploader(document.getElementById("uploader"), { onChange: updateTotal });

    function updateTotal() {
      const dollars = parseFloat(document.getElementById("rate_per_page").value || "0");
      const el = document.getElementById("total-line");
      if (!uploader.count) {
        el.textContent = "Add pages to see the total.";
        return;
      }
      const cents = Math.round(dollars * 100) * uploader.count;
      el.innerHTML = `<strong>${uploader.count} page${uploader.count === 1 ? "" : "s"}</strong>` +
        (cents ? ` at ${formatCents(Math.round(dollars * 100))}/page = <strong>${formatCents(cents)}</strong>, paid once a Grade Angel accepts.` : "");
    }
    document.getElementById("rate_per_page").addEventListener("input", updateTotal);

    async function loadGradeAngels() {
      try {
        const { grade_angels } = await apiGet("/api/grade-angels");
        const select = document.getElementById("invite");
        select.innerHTML += grade_angels
          .map((g) => `<option value="${g.id}">${escapeHtml(g.full_name)}${g.subjects ? " (" + escapeHtml(g.subjects) + ")" : ""}</option>`)
          .join("");
      } catch {
        // Inviting is optional; the default of any Grade Angel still works.
      }
    }

    document.getElementById("invite").addEventListener("change", (e) => {
      const note = document.getElementById("invite-note");
      note.style.display = e.target.value ? "" : "none";
      note.textContent = "Only this Grade Angel will see it. If they decline, it opens up to everyone.";
    });

    function stateLine(a) {
      if (a.status === "draft") return "Upload did not finish. Cancel it and post again.";
      if (a.status === "open" && a.invited_grade_angel_name) return `Waiting on ${escapeHtml(a.invited_grade_angel_name)} to accept`;
      if (a.status === "open") {
        const note = EVENT_NOTES[a.last_event_kind];
        const reason = note && a.last_event_note ? ` A Grade Angel ${note}: "${escapeHtml(a.last_event_note)}"` : "";
        return "Waiting for a Grade Angel." + reason;
      }
      if (a.status === "accepted") return `${escapeHtml(a.grade_angel_name || "A Grade Angel")} is grading. ${formatDue(a.due_at)}.`;
      if (a.status === "submitted") return `${escapeHtml(a.grade_angel_name || "Your Grade Angel")} sent the graded work back. Review it and mark it complete.`;
      if (a.status === "completed") return `Graded by ${escapeHtml(a.grade_angel_name || "a Grade Angel")}.`;
      return "";
    }

    function renderAssignmentCard(a) {
      const total = formatCents(a.rate_per_page_cents * a.page_count);
      const needsPayment = (a.status === "accepted" || a.status === "submitted") && a.payment_status !== "paid";
      const actions = [`<a class="btn small secondary" href="/assignment.html?id=${a.id}">Open</a>`];
      if (needsPayment) actions.push(`<button class="btn small" data-pay-id="${a.id}">Pay ${total}</button>`);
      if (a.status === "submitted") actions.push(`<button class="btn small" data-complete-id="${a.id}">Mark complete</button>`);
      if (a.status === "draft" || a.status === "open") actions.push(`<button class="btn small ghost" data-cancel-id="${a.id}">Cancel</button>`);
      const paymentNote =
        a.payment_status === "paid"
          ? a.payout_status === "transferred"
            ? '<span class="pill status-completed">Paid, Grade Angel paid out</span>'
            : '<span class="pill status-accepted">Paid</span>'
          : "";
      return `
        <div class="card">
          <h3 class="assignment-title"><a class="plain" href="/assignment.html?id=${a.id}">${escapeHtml(a.title)}</a> ${statusPillHtml(a.status)} ${paymentNote}</h3>
          <p class="assignment-meta">${escapeHtml(a.subject)} · ${escapeHtml(a.grade_level)} · ${a.page_count} pages · ${total} total</p>
          <p class="state-line">${stateLine(a)}</p>
          <div class="row-actions">${actions.join("")}</div>
        </div>
      `;
    }

    async function loadAssignments() {
      const list = document.getElementById("list");
      list.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const { assignments } = await apiGet("/api/assignments/list");
        const shown = assignments.filter((a) => a.status !== "cancelled");
        if (shown.length === 0) {
          list.innerHTML = '<p class="muted">Nothing posted yet.</p>';
          return;
        }
        list.innerHTML = shown.map(renderAssignmentCard).join("");
      } catch (err) {
        list.innerHTML = `<div class="msg error">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.completeId) completeAssignment(btn.dataset.completeId, btn);
      if (btn.dataset.payId) payForAssignment(btn.dataset.payId, btn);
      if (btn.dataset.cancelId) cancelAssignment(btn.dataset.cancelId, btn);
    });

    async function completeAssignment(id, btn) {
      btn.disabled = true;
      try {
        const { payout_note } = await apiPostJson("/api/assignments/complete", { assignment_id: Number(id) });
        if (payout_note) alert(payout_note);
        loadAssignments();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    async function payForAssignment(id, btn) {
      btn.disabled = true;
      try {
        const { url } = await apiPostJson("/api/assignments/pay", {
          assignment_id: Number(id),
          success_url: window.location.href,
          cancel_url: window.location.href,
        });
        window.location.href = url;
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    async function cancelAssignment(id, btn) {
      if (!confirm("Cancel this assignment? Its pages will be deleted.")) return;
      btn.disabled = true;
      try {
        await apiPostJson("/api/assignments/cancel", { assignment_id: Number(id) });
        loadAssignments();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    const createForm = document.getElementById("create-form");
    const createMsg = document.getElementById("create-msg");
    // If pages fail to upload, the draft is kept so pressing Post again
    // retries the same assignment instead of creating a second one.
    let pendingDraftId = null;

    createForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showMessage(createMsg, "", "");
      if (uploader.isBusy) return showMessage(createMsg, "Still preparing your pages. Try again in a moment.", "error");
      if (!uploader.count) return showMessage(createMsg, "Add at least one page to grade.", "error");

      const submitBtn = createForm.querySelector('button[type="submit"]');
      const progress = document.getElementById("upload-progress");
      const bar = document.getElementById("upload-bar");
      submitBtn.disabled = true;
      let assignmentId = pendingDraftId;
      try {
        const dollars = parseFloat(document.getElementById("rate_per_page").value || "0");
        const invite = document.getElementById("invite").value;
        if (!assignmentId) {
          const { assignment } = await apiPostJson("/api/assignments/create", {
            title: document.getElementById("title").value,
            subject: document.getElementById("subject").value,
            grade_level: document.getElementById("grade_level").value,
            assignment_type: document.getElementById("assignment_type").value,
            rate_per_page_cents: Math.round(dollars * 100),
            turnaround_hours: Number(document.getElementById("turnaround_hours").value),
            invited_grade_angel_id: invite ? Number(invite) : null,
            instructions: document.getElementById("instructions").value,
          });
          assignmentId = pendingDraftId = assignment.id;
        }

        progress.style.display = "";
        bar.style.width = "0%";
        submitBtn.textContent = "Uploading pages…";
        await uploader.upload(assignmentId, (done, total) => {
          bar.style.width = Math.round((done / total) * 100) + "%";
          submitBtn.textContent = `Uploading page ${done} of ${total}…`;
        });

        await apiPostJson("/api/assignments/publish", { assignment_id: assignmentId, expected_pages: uploader.count });
        pendingDraftId = null;
        showMessage(createMsg, "Posted. Grade Angels can see it now.", "success");
        createForm.reset();
        uploader.clear();
        document.getElementById("invite-note").style.display = "none";
      } catch (err) {
        showMessage(
          createMsg,
          err.message + (pendingDraftId ? " Your pages are still here. Press Post assignment to try the upload again." : ""),
          "error"
        );
      } finally {
        progress.style.display = "none";
        submitBtn.disabled = false;
        submitBtn.textContent = "Post assignment";
        loadAssignments();
      }
    });

    requireRole("teacher").then((user) => {
      if (!user) return;
      loadGradeAngels();
      loadAssignments();
    });
  </script>
</body>
</html>
